services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ies
      POSTGRES_PASSWORD: ies
      POSTGRES_DB: ies
    ports:
      - "5432:5432"
    volumes:
      - ies_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ies -d ies"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  ies_pg:
